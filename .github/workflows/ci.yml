name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Placeholder values so `next build` (which validates env at config load via
# lib/env.ts) can run in CI. Must stay in sync with the schema in lib/env.ts —
# only vars without a schema default are required here.
env:
  TURSO_DATABASE_URL: libsql://ci-placeholder.turso.io
  TURSO_AUTH_TOKEN: ci-placeholder-token
  R2_ACCOUNT_ID: ci-placeholder-account
  R2_ACCESS_KEY_ID: ci-placeholder-key-id
  R2_SECRET_ACCESS_KEY: ci-placeholder-secret-key
  R2_BUCKET: ci-placeholder-bucket
  R2_PUBLIC_BASE_URL: https://ci-placeholder.example.com
  TRANSCRIPTION_API_KEY: ci-placeholder-transcription-key
  TRANSCRIPTION_PROVIDER: openai
  APP_SECRET: ci-placeholder-secret-32chars-min
  APP_BASE_URL: https://ci-placeholder.example.com
  AUTH_ALLOWLIST: ci@example.com
  SMTP_HOST: smtp.ci-placeholder.example.com
  SMTP_USER: ci-placeholder-user
  SMTP_PASSWORD: ci-placeholder-password
  SMTP_FROM: CI <ci@ci-placeholder.example.com>

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version is read from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
