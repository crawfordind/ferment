name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURSO_DATABASE_URL: libsql://ci-placeholder.turso.io
  TURSO_AUTH_TOKEN: ci-placeholder-token
  R2_ACCOUNT_ID: ci-placeholder-account
  R2_ACCESS_KEY_ID: ci-placeholder-key-id
  R2_SECRET_ACCESS_KEY: ci-placeholder-secret-key
  R2_BUCKET: ci-placeholder-bucket
  R2_PUBLIC_BASE_URL: https://ci-placeholder.example.com
  TRANSCRIPTION_API_KEY: ci-placeholder-transcription-key
  TRANSCRIPTION_PROVIDER: openai
  APP_PASSCODE: ci-placeholder-passcode
  APP_SECRET: ci-placeholder-secret-32chars-min
  # Required by lib/env.ts and validated at `next build` (via next.config.ts).
  # Placeholders only — CI never sends mail or issues real login links.
  APP_BASE_URL: https://ci-placeholder.example.com
  AUTH_ALLOWLIST: ci@example.com
  SMTP_HOST: smtp.ci-placeholder.example.com
  SMTP_USER: ci@example.com
  SMTP_PASSWORD: ci-placeholder-smtp-password
  SMTP_FROM: CI <ci@example.com>

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version is read from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
